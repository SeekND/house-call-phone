<!doctype html>
<!-- House Call, a phone in the flat (card S15, docs/plans/S15-phone-in-the-flat.md; docs/research/phone-players.md).
     An Android phone in Chrome sees the flat through its camera, with the game's man standing in it, and shoots him.
     - This page is public over HTTPS, so AR may run here. It holds only code: the man and the flat come from the
       headset over the home Wi-Fi (net/friend_server.gd, net/phone_link.gd), after Chrome's one "Allow".
     - The friend's page on the headset sends the phone here with the headset's address and the code after the #,
       which never leaves the phone.
     - Line-up: tap the floor at both feet of a doorway the headset's map knows (lineup.js).
     - A tap shoots along the crosshair; the headset decides the hit.
     - With no AR (a desktop browser), "Preview" lines up on made-up taps instead, to check the rest. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>House Call: a phone in the flat</title>
<style>
	:root { --bg: #14161a; --panel: #1f2329; --ink: #e8e6e1; --muted: #9aa0a8; --go: #4aa8f0; --bad: #f05a50; --hit: #f0c040; }
	* { box-sizing: border-box; }
	html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
		font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
	#start { max-width: 420px; margin: 0 auto; padding: 32px 16px; }
	h1 { font-size: 22px; margin: 0 0 8px; }
	p { color: var(--muted); margin: 0 0 16px; }
	label { display: block; color: var(--muted); font-size: 14px; margin: 12px 0 6px; }
	input, select { width: 100%; font-size: 18px; padding: 10px; border-radius: 10px;
		border: 1px solid #3a4049; background: var(--panel); color: var(--ink); }
	button { font-size: 18px; padding: 14px; border: 0; border-radius: 10px; background: var(--go); color: #10161c; font-weight: 600; }
	button:disabled { opacity: 0.4; }
	#connect, #ar { width: 100%; margin-top: 16px; }
	#log { font: 12px/1.45 ui-monospace, monospace; color: var(--muted); white-space: pre-wrap; margin-top: 16px;
		background: var(--panel); padding: 10px; border-radius: 10px; max-height: 40vh; overflow: auto; }
	#why { color: var(--bad); min-height: 1.4em; margin-top: 10px; }
	/* In AR: the DOM overlay, over the camera's view. */
	#overlay { position: fixed; inset: 0; pointer-events: none; display: none; }
	#overlay > * { pointer-events: auto; }
	#bar { position: absolute; left: 0; right: 0; top: 0; padding: 8px 12px; background: rgba(20, 22, 26, 0.75);
		display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
	#nums { color: var(--muted); white-space: nowrap; }
	#say { position: absolute; left: 12px; right: 12px; bottom: 84px; padding: 10px 12px; border-radius: 10px;
		background: rgba(20, 22, 26, 0.8); text-align: center; font-size: 16px; }
	#tools { position: absolute; left: 12px; right: 12px; bottom: 16px; display: flex; gap: 8px; }
	#tools button, #tools select { flex: 1; font-size: 15px; padding: 12px 6px; }
	#cross { position: absolute; left: 50%; top: 50%; width: 28px; height: 28px; margin: -14px 0 0 -14px; pointer-events: none; }
	#cross::before, #cross::after { content: ""; position: absolute; background: #fff; box-shadow: 0 0 2px #000; }
	#cross::before { left: 13px; top: 0; width: 2px; height: 28px; }
	#cross::after { top: 13px; left: 0; height: 2px; width: 28px; }
	#mark { position: absolute; left: 50%; top: 50%; width: 60px; margin: -30px 0 0 -30px; text-align: center;
		font-size: 44px; line-height: 60px; color: var(--hit); text-shadow: 0 0 4px #000; pointer-events: none; display: none; }
	#flash { position: absolute; inset: 0; background: radial-gradient(circle, rgba(255, 220, 140, 0.55), rgba(255, 220, 140, 0) 55%);
		pointer-events: none; display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
	"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="start">
	<h1>House Call</h1>
	<p>A phone in the flat. Open this from the friend's page on the headset, which fills in its address and the code.</p>
	<label for="addr">The headset's address</label>
	<input id="addr" placeholder="192.168.0.21:8081" autocomplete="off">
	<label for="code">The code</label>
	<input id="code" inputmode="numeric" maxlength="4" autocomplete="off">
	<button id="connect">Connect</button>
	<button id="ar" disabled>Start AR</button>
	<div id="why"></div>
	<div id="log"></div>
</div>
<div id="overlay">
	<div id="bar"><span id="state"></span><span id="nums"></span></div>
	<div id="cross"></div>
	<div id="mark">✕</div>
	<div id="flash"></div>
	<div id="say"></div>
	<div id="tools">
		<select id="door" aria-label="The doorway to line up on"></select>
		<button id="again">Line up again</button>
		<button id="walls">Show walls</button>
	</div>
</div>
<script type="module">
"use strict";
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { lineUpDoor, toPhone } from "./lineup.js";

const $ = (id) => document.getElementById(id);
// The phone's pose goes this often (ms); its frame rate once a second.
const POSE_MS = 50;
const hash = new URLSearchParams(location.hash.slice(1));
let ws = null, scene = null, manAt = null, lu = null, preview = false;
let taps = [], file = null, glb = null, shotT = new Map(), lastPose = 0, frames = 0, fpsAt = 0, fps = 0, rtt = null;
// What Chrome allowed, line by line: shown here and sent to the headset.
const said = [];
function log(line) {
	said.push(line);
	$("log").textContent = said.join("\n");
	console.log(line);
}

// --- Connecting, and what Chrome allows -----------------------------------------------------------------------

async function permission(name) {
	try { return (await navigator.permissions.query({ name })).state; } catch (e) { return "unknown here (" + e.name + ")"; }
}

async function connect() {
	const addr = $("addr").value.trim(), code = $("code").value.trim();
	if (!/^[0-9]{4}$/.test(code) || !addr.includes(":")) { $("why").textContent = "Fill in the headset's address and the four-digit code."; return; }
	$("why").textContent = "";
	$("connect").disabled = true;
	log("page: " + location.origin + ", secure context " + window.isSecureContext);
	log("Chrome: " + (navigator.userAgentData ? navigator.userAgentData.brands.map((b) => b.brand + " " + b.version).join(", ") : navigator.userAgent));
	for (const n of ["local-network-access", "local-network"]) log("permission " + n + ": " + await permission(n));
	const host = addr.split(":")[0], tls = hash.get("s");
	const routes = ["ws://" + addr];
	if (tls && tls !== "0") routes.push("wss://" + host + ":" + tls);
	for (const url of routes) {
		const sock = await tryOpen(url);
		if (sock) { ws = sock; break; }
	}
	for (const n of ["local-network-access", "local-network"]) log("permission " + n + " after: " + await permission(n));
	if (!ws) {
		$("why").textContent = "Chrome didn't reach the headset. The lines below say what it allowed.";
		$("connect").disabled = false;
		return;
	}
	ws.binaryType = "arraybuffer";
	ws.onmessage = (e) => heard(e.data);
	ws.onclose = (e) => { say("Lost the headset (" + e.code + "). Reload the page to join again."); $("why").textContent = "Lost the headset."; };
	ws.send(JSON.stringify({ join: code, name: hash.get("n") || "", phone: true }));
}

// One route: the socket once open, or null after an error or 6 s; logged either way.
function tryOpen(url) {
	return new Promise((done) => {
		const t0 = performance.now();
		let sock;
		try { sock = new WebSocket(url); } catch (e) { log(url + ": refused at once, " + e.name + ": " + e.message); done(null); return; }
		const give = setTimeout(() => { log(url + ": no answer in 6 s"); sock.close(); done(null); }, 6000);
		sock.onopen = () => { clearTimeout(give); log(url + ": open in " + Math.round(performance.now() - t0) + " ms"); done(sock); };
		sock.onerror = () => { clearTimeout(give); log(url + ": error after " + Math.round(performance.now() - t0) + " ms"); done(null); };
	});
}

// A plain http:// fetch from this page to the headset, for the record: Chrome's mixed-content rule with Local
// Network Access. Nothing depends on it.
async function probeFetch() {
	const url = "http://" + $("addr").value.trim().split(":")[0] + ":" + (hash.get("h") || "8080") + "/phone/lineup.js";
	try {
		const r = await fetch(url, { targetAddressSpace: "local" });
		log("fetch " + url + " (targetAddressSpace local): " + r.status);
	} catch (e) { log("fetch " + url + " (targetAddressSpace local): " + e.name + ": " + e.message); }
}

function send(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }

function heard(data) {
	if (data instanceof ArrayBuffer) { piece(data); return; }
	const m = JSON.parse(data);
	if (m.refused) { $("why").textContent = m.refused; return; }
	if (m.ping !== undefined) { send({ pong: m.ping }); return; }
	if (m.welcome) {
		log("joined as " + m.name);
		probeFetch().then(() => send({ chrome: said }));
		send({ phone: { ua: navigator.userAgent, secure: window.isSecureContext, xr: !!navigator.xr } });
		return;
	}
	if (m.note) say(m.note);
	if (m.rtt !== undefined) rtt = m.rtt;
	if (m.scene) { scene = m.scene; doors(); }
	if (m.man) setMan(m.man);
	if (m.file) { file = { name: m.file, size: m.size, buf: new Uint8Array(m.size), got: 0, t0: performance.now() }; $("why").textContent = "Loading the man…"; }
	if (m.shot) shotBack(m.shot);
}

function piece(data) {
	if (!file) return;
	file.buf.set(new Uint8Array(data), file.got);
	file.got += data.byteLength;
	$("why").textContent = "Loading the man… " + Math.round(100 * file.got / file.size) + "%";
	if (file.got < file.size) return;
	const ms = Math.round(performance.now() - file.t0);
	log(file.name + ": " + (file.size / 1e6).toFixed(1) + " MB in " + ms + " ms");
	new GLTFLoader().parse(file.buf.buffer, "", (g) => {
		glb = g;
		send({ loaded: { file: file.name, bytes: file.size, ms, clips: g.animations.length } });
		build();
	}, (e) => { log("the man didn't load: " + e); send({ loaded: { file: file.name, error: String(e) } }); });
}

// --- The 3D world ------------------------------------------------------------------------------------------------

let renderer, world, man, mixer, occ, reticle, feet, camera, three, clock = new THREE.Clock(), wallsShown = false;
const hide = new THREE.MeshBasicMaterial({ colorWrite: false });
const seen = new THREE.MeshBasicMaterial({ color: 0x4aa8f0, wireframe: true });

function build() {
	renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
	renderer.setPixelRatio(window.devicePixelRatio);
	renderer.setSize(window.innerWidth, window.innerHeight);
	renderer.xr.enabled = true;
	document.body.appendChild(renderer.domElement);
	renderer.domElement.style.display = "none";
	three = new THREE.Scene();
	camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.05, 60);
	three.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.0));
	const sun = new THREE.DirectionalLight(0xffffff, 1.5);
	sun.position.set(1, 3, 2);
	three.add(sun);
	// The Quest's world, placed in the phone's by the line-up.
	world = new THREE.Group();
	world.matrixAutoUpdate = false;
	world.visible = false;
	three.add(world);
	// Real walls and furniture, drawn into depth only, first: the man behind them is hidden.
	occ = new THREE.Group();
	for (const [cx, cy, cz, sx, sy, sz, yaw] of scene.boxes) {
		const b = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), hide);
		b.position.set(cx, cy, cz);
		b.rotation.y = yaw * Math.PI / 180;
		b.renderOrder = -1;
		occ.add(b);
	}
	world.add(occ);
	man = new THREE.Group();
	man.add(glb.scene);
	world.add(man);
	if (glb.animations.length) { mixer = new THREE.AnimationMixer(glb.scene); mixer.clipAction(glb.animations[0]).play(); }
	if (manAt) setMan(manAt);
	// The doorway's feet, once lined up, with the walls shown.
	feet = new THREE.Group();
	world.add(feet);
	reticle = new THREE.Mesh(new THREE.RingGeometry(0.05, 0.07, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffffff }));
	reticle.matrixAutoUpdate = false;
	reticle.visible = false;
	three.add(reticle);
	$("why").textContent = "";
	$("ar").disabled = false;
	const noAR = (why) => { log("immersive-ar: " + why); preview = true; $("ar").textContent = "Preview (no AR here)"; };
	if (!navigator.xr) noAR("no WebXR here");
	else navigator.xr.isSessionSupported("immersive-ar").then((ok) => ok ? log("immersive-ar: supported") : noAR("not supported"));
}

function setMan(m) {
	manAt = m;
	if (!man) return;
	man.position.set(m.at[0], m.at[1], m.at[2]);
	man.rotation.set(0, m.yaw, 0);
	man.userData.down = m.state !== "standing";
	if (!man.userData.down) glb.scene.rotation.x = 0;
}

function doors() {
	const sel = $("door");
	sel.innerHTML = "";
	scene.doors.forEach((d, k) => {
		const o = document.createElement("option");
		o.value = k;
		o.textContent = d.stand + " → " + d.into;
		sel.appendChild(o);
	});
	if (scene.pick !== undefined) sel.value = scene.pick;
}

const door = () => scene.doors[+$("door").value];

// --- AR --------------------------------------------------------------------------------------------------------

let session = null, hitSource = null;

async function startAR() {
	$("start").style.display = "none";
	$("overlay").style.display = "block";
	renderer.domElement.style.display = "block";
	if (preview) { startPreview(); return; }
	try {
		session = await navigator.xr.requestSession("immersive-ar", { requiredFeatures: ["hit-test"], optionalFeatures: ["dom-overlay"], domOverlay: { root: $("overlay") } });
	} catch (e) {
		log("AR refused: " + e.name + ": " + e.message);
		send({ chrome: said });
		$("start").style.display = "block"; $("overlay").style.display = "none";
		return;
	}
	log("AR on; DOM overlay " + (session.domOverlayState ? session.domOverlayState.type : "none"));
	send({ chrome: said });
	renderer.xr.setReferenceSpaceType("local");
	await renderer.xr.setSession(session);
	const viewer = await session.requestReferenceSpace("viewer");
	hitSource = await session.requestHitTestSource({ space: viewer });
	session.addEventListener("select", tapped);
	session.addEventListener("end", () => { session = null; $("start").style.display = "block"; $("overlay").style.display = "none"; renderer.domElement.style.display = "none"; });
	lineUpAgain();
	renderer.setAnimationLoop(frame);
}

// Taps on the buttons aren't shots or floor taps.
for (const b of document.querySelectorAll("#tools > *")) b.addEventListener("beforexrselect", (e) => e.preventDefault());

function lineUpAgain() {
	taps = [];
	lu = null;
	world.visible = false;
	say(door().words + " Point the ring at the floor at the doorway's left foot and tap. (Sweep the phone over the floor first if there's no ring.)");
}

function tapped() {
	if (lu) { shoot(); return; }
	if (!reticle.visible) { say("No floor found yet: sweep the phone slowly over the floor until the ring shows."); return; }
	const p = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
	taps.push([p.x, p.y, p.z]);
	if (taps.length === 1) { say("Now the doorway's right foot: tap the floor there."); return; }
	const cam = new THREE.Vector3().setFromMatrixPosition(viewMatrix);
	lined(lineUpDoor(taps[0], taps[1], door(), [cam.x, cam.y, cam.z]));
}

function lined(res) {
	lu = res;
	const d = door();
	// world = the Quest's world in the phone's: the inverse of p -> turn(p, yaw) + move.
	const m = new THREE.Matrix4().makeRotationY(lu.yaw).setPosition(lu.move[0], lu.move[1], lu.move[2]);
	world.matrix.copy(m.invert());
	world.matrixWorldNeedsUpdate = true;
	world.visible = true;
	feet.clear();
	for (const q of [d.left, d.right]) {
		const f = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.4), new THREE.MeshBasicMaterial({ color: 0x4aa8f0 }));
		f.position.set(q[0], q[1] + 0.2, q[2]);
		f.visible = wallsShown;
		feet.add(f);
	}
	const cm = (lu.widthErr * 100).toFixed(1);
	log("lined up on " + d.stand + " → " + d.into + ": the taps' spacing " + cm + " cm off the doorway's" + (lu.swapped ? " (tapped right first)" : ""));
	send({ lined: { door: d.i, stand: d.stand, into: d.into, yaw: lu.yaw, move: lu.move, width_err: lu.widthErr, swapped: lu.swapped, preview } });
	say((Math.abs(lu.widthErr) > 0.05 ? "The taps were " + cm + " cm off the doorway's width: line up again if he looks off. " : "Lined up. ") +
		"Find the man; aim the cross at him and tap to shoot.");
}

let viewMatrix = new THREE.Matrix4();

let lastFrame = 0;
function frame(t, xr) {
	lastFrame = performance.now();
	const dt = clock.getDelta();
	if (mixer) mixer.update(dt);
	// Down: tipped over backwards in half a second (the headset has the real fall).
	if (man && man.userData.down) glb.scene.rotation.x = Math.max(glb.scene.rotation.x - dt * Math.PI, -Math.PI / 2);
	if (xr) {
		const ref = renderer.xr.getReferenceSpace();
		const pose = xr.getViewerPose(ref);
		if (pose) viewMatrix.fromArray(pose.transform.matrix);
		const hits = hitSource ? xr.getHitTestResults(hitSource) : [];
		reticle.visible = !lu && hits.length > 0;
		if (reticle.visible) reticle.matrix.fromArray(hits[0].getPose(ref).transform.matrix);
	} else {
		viewMatrix.copy(camera.matrixWorld);
	}
	frames++;
	const now = performance.now();
	if (now - fpsAt >= 1000) {
		fps = Math.round(frames * 1000 / (now - fpsAt || 1000));
		frames = 0; fpsAt = now;
		send({ fps });
	}
	if (lu && now - lastPose >= POSE_MS) { lastPose = now; send({ pose: inQuest(viewMatrix) }); }
	$("state").textContent = lu ? "Lined up" : (taps.length ? "Tap the right foot" : "Tap the left foot");
	$("nums").textContent = fps + " fps" + (rtt !== null ? " · " + Math.round(rtt) + " ms" : "");
	renderer.render(three, camera);
}

// The phone's pose in the Quest's world: {p, q (x, y, z, w)}.
function inQuest(mat) {
	const m = new THREE.Matrix4().makeRotationY(lu.yaw).setPosition(lu.move[0], lu.move[1], lu.move[2]).multiply(mat);
	const p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3();
	m.decompose(p, q, s);
	return { p: [p.x, p.y, p.z], q: [q.x, q.y, q.z, q.w] };
}

let shots = 0;
function shoot() {
	const pose = inQuest(viewMatrix);
	const d = new THREE.Vector3(0, 0, -1).applyQuaternion(new THREE.Quaternion(...pose.q));
	const n = ++shots;
	shotT.set(n, performance.now());
	send({ shot: { n, o: pose.p, d: [d.x, d.y, d.z] } });
	$("flash").style.display = "block";
	setTimeout(() => $("flash").style.display = "none", 60);
	navigator.vibrate?.(30);
}

function shotBack(s) {
	const ms = shotT.has(s.n) ? Math.round(performance.now() - shotT.get(s.n)) : -1;
	shotT.delete(s.n);
	send({ shot_rtt: { n: s.n, ms } });
	if (s.hit) {
		$("mark").style.display = "block";
		setTimeout(() => $("mark").style.display = "none", 400);
		say("Hit: " + s.words + " (" + ms + " ms there and back).");
	} else say("Missed (" + ms + " ms there and back).");
}

function say(text) { $("say").textContent = text; }

// --- Preview: no AR, made-up taps --------------------------------------------------------------------------------

// A made-up phone world, turned and moved off the Quest's, as Chrome's would be: the line-up must find it.
const FAKE = { yaw: 0.9, move: [1.3, -0.2, -2.1] };

function startPreview() {
	const d = door();
	// Standing 1.2 m back from the doorway on its side, the phone at 1.4 m.
	const stand = [d.centre[0] + d.normal[0] * 1.2, d.centre[1] + 1.4, d.centre[2] + d.normal[2] * 1.2];
	const phone = toPhone(stand, FAKE);
	lined(lineUpDoor(toPhone(d.right, FAKE), toPhone(d.left, FAKE), d, phone));
	camera.position.set(...phone);
	const look = manAt ? toPhone([manAt.at[0], manAt.at[1] + 1.2, manAt.at[2]], FAKE) : toPhone(d.centre, FAKE);
	camera.lookAt(...look);
	// Is he behind a wall or a box from here? Real occlusion, or a fault: the log says which.
	world.updateMatrixWorld(true);
	const to = new THREE.Vector3(...look).sub(camera.position);
	const ray = new THREE.Raycaster(camera.position.clone(), to.clone().normalize(), 0, to.length());
	const faces = ray.intersectObjects(occ.children);
	log("preview: his chest " + (faces.length ? "is behind " + faces.length + " face(s) of the walls and furniture from here, the first " + faces[0].distance.toFixed(2) + " m off" : "is in plain sight from here"));
	if (!startPreview.once) renderer.domElement.addEventListener("pointerdown", (e) => {
		// The cross follows the click in the preview: aim the camera there, then shoot along it.
		const ndc = new THREE.Vector2(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
		const ray = new THREE.Raycaster();
		ray.setFromCamera(ndc, camera);
		camera.lookAt(ray.ray.origin.clone().add(ray.ray.direction));
		camera.updateMatrixWorld();
		viewMatrix.copy(camera.matrixWorld);
		shoot();
	});
	startPreview.once = true;
	renderer.setAnimationLoop(frame);
	// A hidden tab gets no animation frames: drawn on a timer then, so a preview can still be looked at.
	setInterval(() => { if (performance.now() - lastFrame > 500) frame(performance.now(), null); }, 250);
}

// --- Buttons --------------------------------------------------------------------------------------------------

$("connect").onclick = connect;
$("ar").onclick = startAR;
$("again").onclick = () => preview ? startPreview() : lineUpAgain();
$("door").onchange = () => { if (!preview) lineUpAgain(); };
$("walls").onclick = () => {
	wallsShown = !wallsShown;
	for (const b of occ.children) b.material = wallsShown ? seen : hide;
	for (const f of feet.children) f.visible = wallsShown;
	$("walls").textContent = wallsShown ? "Hide walls" : "Show walls";
};
window.addEventListener("resize", () => {
	if (!renderer || session) return;
	camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});
